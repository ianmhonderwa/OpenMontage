# Example brand profile. Load with:  python examples/sample_workflow.py --brand examples/sample_brand_config.yaml
name: Ore Academy
description: Practical mineral-processing education for students and plant engineers.
target_audience: Engineering students and junior metallurgists in Southern Africa.
tone_of_voice: Clear, practical, evidence-based. No hype.
language: en-GB
writing_preferences:
  - British spelling
  - Explain one idea per post
  - State units for every number
colours: ["#1F3A5F", "#F2A541"]
logo_files: ["media/brand/logo.png"]
approved_terms: [comminution, flotation, recovery, throughput]
restricted_terms: [guaranteed, miracle, "100% recovery"]
content_categories: [lessons, plant tips, careers]
hashtags: [OreAcademy, Metallurgy]
publishing_frequency:
  youtube: weekly
  tiktok: 3 per week
  instagram: 3 per week
  facebook: weekly
platforms:
  youtube:
    call_to_action: Subscribe for a new lesson every week.
    max_hashtags: 3
  tiktok:
    call_to_action: Follow for part 2.
    max_hashtags: 5
  instagram:
    call_to_action: Save this for your next lab session.
    max_hashtags: 8
  facebook:
    call_to_action: Share with a classmate who needs this.
    max_hashtags: 2
