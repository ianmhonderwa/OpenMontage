name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - run: pytest --cov --cov-report=xml --cov-fail-under=85

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: bandit -q -r src -ll
      - run: pip-audit --skip-editable
      - run: python scripts/security_check.py

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [python, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opensocial-mcp:ci .
      - run: |
          docker run -d --name os -p 8080:8080 \
            -e OPENSOCIAL_ENCRYPTION_KEYS=$(python3 -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())") \
            -e OPENSOCIAL_DATABASE_URL=sqlite:////tmp/ci.db -e OPENSOCIAL_DEMO_MODE=true opensocial-mcp:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs localhost:8080/api/health
