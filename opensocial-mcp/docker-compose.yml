# Local/self-hosted deployment: API + dashboard, scheduler and PostgreSQL.
# Secrets come from .env (never committed). See docs/deployment.md.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opensocial
      POSTGRES_USER: opensocial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensocial"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      OPENSOCIAL_DATABASE_URL: postgresql+psycopg://opensocial:${POSTGRES_PASSWORD}@db:5432/opensocial
    ports: ["127.0.0.1:8080:8080"]
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

  scheduler:
    build: .
    command: ["opensocial", "scheduler"]
    env_file: .env
    environment:
      OPENSOCIAL_DATABASE_URL: postgresql+psycopg://opensocial:${POSTGRES_PASSWORD}@db:5432/opensocial
    volumes: [media:/data/media]
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
  media:
